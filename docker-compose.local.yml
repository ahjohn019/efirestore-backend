services:
  stripe-cli:
    image: stripe/stripe-cli:latest
    profiles: ['stripe']
    restart: unless-stopped
    environment:
      STRIPE_API_KEY: ${STRIPE_PAYMENT_DEV_SECRET_KEY:-}
    command: ['listen', '--events', 'checkout.session.completed,checkout.session.async_payment_succeeded', '--forward-to', 'http://efirestore-backend.test/api/stripe/webhook']
    extra_hosts:
      - 'efirestore-backend.test:host-gateway'
    depends_on:
      app:
        condition: service_started

  app:
    build:
      target: local
    command: ./docker/start.sh
    restart: 'no'
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./nest-cli.json:/app/nest-cli.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: sync+restart
          path: ./public
          target: /app/public
        - action: sync+restart
          path: ./nest-cli.json
          target: /app/nest-cli.json
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./tsconfig.build.json
          target: /app/tsconfig.build.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./docker-compose.local.yml
    environment:
      APP_MODE: local
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_RUN_MIGRATIONS: 'false'
      DATABASE_RUN_SEEDS: 'false'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 1000
      WATCHPACK_POLLING: 'true'
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
      TSC_NONPOLLING_WATCHER: ''
